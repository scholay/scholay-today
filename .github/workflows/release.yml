name: Windows release draft
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm prepare:mcp
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p papr --features windows-smoke --example windows-smoke
      - run: pnpm build:desktop
      - name: Create draft for maintainer review
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Installer = (Get-ChildItem target/release/bundle/nsis/*.exe).FullName
          if (-not $Installer) { throw 'No installer was produced' }
          Get-FileHash $Installer -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME $Installer SHA256SUMS.txt --draft --generate-notes --title "scholay tody $env:GITHUB_REF_NAME"
